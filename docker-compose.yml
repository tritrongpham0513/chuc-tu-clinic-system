# ============================================================================
# DOCKER COMPOSE - HỆ THỐNG PHÒNG KHÁM CHÚC TỪ
# ============================================================================
# Khởi chạy toàn bộ hệ thống bằng 1 lệnh duy nhất:
#   docker compose up --build -d
#
# Dừng hệ thống:
#   docker compose down
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.0
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: chuctupk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-phongkham_chuctu}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --character-set-client-handshake=FALSE
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - chuctupk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - chuctupk-network

  # --------------------------------------------------------------------------
  # 2. Backend API (Java 17 / Spring Boot 3)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chuctupk-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      DDL_AUTO: ${DDL_AUTO:-validate}
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTP_EXPOSE_DEV_CODE: ${OTP_EXPOSE_DEV_CODE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-phongkham_chuctu}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-MatKhauAdmin@2026}
      ADMIN_PHONE: ${ADMIN_PHONE:-0912345678}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Quản trị viên Phòng khám}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-log}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-esms}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_TYPE: ${SMS_TYPE:-8}
      SMS_BRANDNAME: ${SMS_BRANDNAME:-}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - chuctupk_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - chuctupk-network

  # --------------------------------------------------------------------------
  # 3. Frontend Web App (React 18 + Vite + Nginx Reverse Proxy)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: chuctupk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - chuctupk-network

volumes:
  chuctupk_mysql_data:
    name: chuctupk_mysql_data
  chuctupk_uploads:
    name: chuctupk_uploads

networks:
  chuctupk-network:
    name: chuctupk-network
    driver: bridge
