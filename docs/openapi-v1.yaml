openapi: 3.1.0
info:
  title: Phòng Khám Chúc Từ — API v1 Specification
  description: Tài liệu đặc tả hợp đồng RESTful API chính thức của Hệ thống Quản lý
    và Tiếp nhận Bệnh nhân Phòng Khám Chúc Từ.
  contact:
    name: Đội ngũ Kỹ thuật Chúc Từ PK
    email: hotro@chuctu.vn
  license:
    name: Nội bộ
    url: https://chuctu.vn
  version: v1.0.0
servers:
- url: /
  description: Server hiện tại (Cùng domain / reverse proxy)
- url: http://localhost:4000
  description: Môi trường Local Development (Port 4000)
security:
- bearerAuth: []
tags:
- name: Phân hệ Người bệnh (Me v1)
  description: "Quản lý thông tin cá nhân, hồ sơ người thân, kiểm tra lịch trống và\
    \ đặt hẹn khám bệnh"
- name: Admin Management API
  description: "Phân hệ quản trị toàn quyền: Dashboard, tài khoản, bài viết, khoá\
    \ hồ sơ và upload ảnh"
- name: Xác thực & Phiên làm việc (Auth v1)
  description: "Các API đăng ký, đăng nhập OTP, đăng nhập nội bộ, đổi mật khẩu và\
    \ quản lý phiên"
- name: Staff Patient Management API
  description: "Quản lý hồ sơ bệnh nhân phía nhân viên: tra cứu, trùng SĐT, lập hồ\
    \ sơ mới, sửa hồ sơ"
- name: Staff Medical Record API
  description: Quản lý phiếu kết quả khám bệnh và bệnh án Y học cổ truyền
- name: Public Post API
  description: "Đọc tin tức, cẩm nang sức khỏe và hoạt động thiện nguyện công khai"
- name: Meta
  description: Thông tin cấu hình và dữ liệu nền tảng của phòng khám
- name: Health
  description: Kiểm tra tình trạng hoạt động của hệ thống
- name: Media Storage API
  description: Tải và phục vụ ảnh media công khai với bộ nhớ đệm immutable
- name: Tài khoản nội bộ (Staff Account v1)
  description: "Xem và cập nhật họ tên, email của tài khoản lễ tân / bác sĩ / quả\
    n trị viên"
- name: Staff Portal API
  description: "Phân hệ nội bộ: Lịch khám, Đặt hộ, Check-in, Hàng đợi 5 ghế"
paths:
  /api/v1/admin/accounts/{id}/role:
    put:
      tags:
      - Admin Management API
      summary: "Đổi vai trò người dùng (USER, RECEPTIONIST, ADMIN)"
      operationId: changeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangeRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    patch:
      tags:
      - Admin Management API
      summary: "Đổi vai trò người dùng (USER, RECEPTIONIST, ADMIN)"
      operationId: changeRole_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangeRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/admin/posts/{id}/pin:
    post:
      tags:
      - Admin Management API
      summary: Ghim bài viết lên đầu trang Tin tức (chỉ 1 bài duy nhất được ghim)
      operationId: pinPost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    patch:
      tags:
      - Admin Management API
      summary: Ghim bài viết lên đầu trang Tin tức (chỉ 1 bài duy nhất được ghim)
      operationId: pinPost_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/admin/patients/{id}/toggle-status:
    post:
      tags:
      - Admin Management API
      summary: Khóa hoặc mở khóa hồ sơ bệnh nhân
      operationId: togglePatientStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientDto"
    patch:
      tags:
      - Admin Management API
      summary: Khóa hoặc mở khóa hồ sơ bệnh nhân
      operationId: togglePatientStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientDto"
  /api/v1/admin/accounts/{id}/toggle-status:
    post:
      tags:
      - Admin Management API
      summary: Khóa hoặc mở khóa tài khoản
      operationId: toggleAccountStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountDto"
    patch:
      tags:
      - Admin Management API
      summary: Khóa hoặc mở khóa tài khoản
      operationId: toggleAccountStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountDto"
  /api/v1/auth/refresh:
    get:
      tags:
      - Xác thực & Phiên làm việc (Auth v1)
      summary: Làm mới Access Token bằng Refresh Token (Cookie hoặc Header)
      operationId: refreshToken
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    post:
      tags:
      - Xác thực & Phiên làm việc (Auth v1)
      summary: Làm mới Access Token bằng Refresh Token (Cookie hoặc Header)
      operationId: refreshToken_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/staff/records/{id}:
    get:
      tags:
      - Staff Medical Record API
      summary: Xem chi tiết phiếu kết quả khám bệnh kèm lịch sử chỉnh sửa
      operationId: getRecord
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRecordDetailResponse"
    put:
      tags:
      - Staff Medical Record API
      summary: Chỉnh sửa phiếu kết quả khám bệnh trong vòng 24 giờ kể từ khi lập
      operationId: updateRecord
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRecordDetailResponse"
  /api/v1/staff/queue/auto-invite:
    put:
      tags:
      - Staff Portal API
      summary: Bật/tắt chế độ tự động mời người kế tiếp khi có ghế trống
      operationId: setAutoInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoInviteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseQueueStateDto"
  /api/v1/patient-profiles/{id}:
    get:
      tags:
      - patient-profile-controller
      operationId: getProfileById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientProfileResponse"
    put:
      tags:
      - patient-profile-controller
      operationId: updateProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientProfileResponse"
    delete:
      tags:
      - patient-profile-controller
      operationId: deleteProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/doctor/medical-records/{id}:
    put:
      tags:
      - doctor-workspace-controller
      operationId: updateMedicalRecord
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicalRecordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDoctorMedicalRecordResponse"
  /api/v1/auth/profile:
    put:
      tags:
      - Xác thực & Phiên làm việc (Auth v1)
      summary: Nhân sự cập nhật họ tên & email nội bộ
      operationId: updateStaffProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/v1/auth/me:
    get:
      tags:
      - Xác thực & Phiên làm việc (Auth v1)
      summary: "Lấy thông tin tài khoản đang đăng nhập (trả về user: null nếu khá\
        ch)"
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    put:
      tags:
      - Xác thực & Phiên làm việc (Auth v1)
      summary: Cập nhật thông tin tài khoản người dùng
      operationId: updateProfile_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/v1/articles/admin/{id}:
    put:
      tags:
      - article-controller
      operationId: updateArticle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseArticleResponse"
    delete:
      tags:
      - article-controller
      operationId: deleteArticle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/admin/users/{id}:
    put:
      tags:
      - admin-user-controller
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserAdminDetailResponse"
  /api/v1/admin/posts/{id}:
    get:
      tags:
      - Admin Management API
      summary: Xem chi tiết một bài viết để chỉnh sửa
      operationId: getAdminPost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    put:
      tags:
      - Admin Management API
      summary: Cập nhật bài viết
      operationId: updateAdminPost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSavePostRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
    delete:
      tags:
      - Admin Management API
      summary: Xóa bài viết
      operationId: deletePost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/admin/patients/{id}:
    get:
      tags:
      - admin-patient-controller
      operationId: getPatient
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientProfileResponse"
    put:
      tags:
      - admin-patient-controller
      operationId: updatePatient
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePatientProfileResponse"
  /api/v1/uploads:
    post:
      tags:
      - Media Storage API
      summary: "Tải ảnh media lên máy chủ (≤ 3MB, JPG/PNG/WEBP/GIF)"
      operationId: uploadImage
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                rawBytes:
                  type: string
                  format: byte
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                rawBytes:
                  type: string
                  format: byte
          image/*:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                rawBytes:
                  type: string
                  format: byte
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/staff/queue/{id}/undo-enter:
    post:
      tags:
      - Staff Portal API
      summary: Hoàn tác vào khám (đưa người bệnh trở lại hàng chờ)
      operationId: undoEnter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseQueueStateDto"
  /api/v1/staff/queue/invite:
    post:
      tags:
      - Staff Portal API
      summary: Mời người kế tiếp trong hàng chờ vào ghế khám còn trống
      operationId: inviteNext
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseQueueStateDto"
  /api/v1/staff/patients:
    get:
      tags:
      - Staff Patient Management API
      summary: Tìm kiếm và phân trang danh sách hồ sơ bệnh nhân
      operationId: getPatients
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: locked
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStaffPatientListResponse"
    post:
      tags:
      - Staff Patient Management API
      summary: Tạo hồ sơ bệnh nhân mới tại quầy tiếp tân (tự sinh mã BN)
      operationId: createPatient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreatePatientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/staff/appointments:
    get:
      tags:
      - Staff Portal API
      summary: Lấy danh sách lịch khám theo ngày kèm thống kê
      operationId: getAppointments
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStaffAppointmentListResponse"
    post:
      tags:
      - Staff Portal API
      summary: Tiếp tân tạo phiếu hẹn khám tại quầy (tuỳ chọn check-in ngay)
      operationId: createCounterAppointment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateAppointmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/staff/appointments/{id}/undo-checkin:
    post:
      tags:
      - Staff Portal API
      summary: Hoàn tác check-in khi tiếp nhận nhầm người
      operationId: undoCheckin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStaffAppointmentLookupResponse"
  /api/v1/staff/appointments/{id}/reschedule:
    post:
      tags:
      - Staff Portal API
      summary: Đổi giờ khám sang ngày/khung giờ mới (cấp phiếu mới)
      operationId: rescheduleAppointment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAppointmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStaffAppointmentLookupResponse"
  /api/v1/staff/appointments/{id}/record:
    post:
      tags:
      - Staff Medical Record API
      summary: Lập phiếu kết quả khám bệnh cho phiếu hẹn đang khám (chuyển trạng thái
        COMPLETED)
      operationId: createRecord
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRecordDetailResponse"
  /api/v1/staff/appointments/{id}/enter:
    post:
      tags:
      - Staff Portal API
      summary: Mời đích danh một người vào khám trước (xếp vào ghế trống tiếp theo)
      operationId: enterRoom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStaffAppointmentLookupResponse"
  /api/v1/staff/appointments/{id}/checkin:
    post:
      tags:
      - Staff Portal API
      summary: Tiếp nhận check-in bệnh nhân (kiểm tra ngày và giờ tiếp nhận 08:00
        - 16:30)
      operationId: checkin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
