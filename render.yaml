services:
  # --------------------------------------------------------------------------
  # 1. Backend API (Spring Boot 4 / Java 17)
  # --------------------------------------------------------------------------
  - type: web
    name: chuctu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    branch: feat/clinic-management-system
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 4000
      - key: DDL_AUTO
        value: validate
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: "0912345678"
      - key: ADMIN_FULL_NAME
        value: "Quản trị viên Phòng khám"
      - key: SMS_ENABLED
        value: "false"

  # --------------------------------------------------------------------------
  # 2. Frontend Web App (React 18 + Vite + Nginx Reverse Proxy)
  # --------------------------------------------------------------------------
  - type: web
    name: chuctu-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    branch: feat/clinic-management-system
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        sync: false
